[package]
name = "backend"
version = "0.1.0"
edition = "2024"
default-run = "backend"

[build-dependencies]
proc-macro2 = { version = "1.0.107", default-features = false }
quote = { version = "1.0.47", default-features = false }

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
prettyplease = "0.3.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
rand = "0.10.3"
rayon = "1.12.0"
syn = "3.0.6"

[profile.release]
debug = "line-tables-only"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "bench_movegen"
harness = false
[[bench]]
name = "bench_pieces"
harness = false
